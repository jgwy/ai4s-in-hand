<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AI4S in Hand 双入口学习地图</title>
  <desc id="desc">Science 背景读者进入第一部分 AI 补给，AI 背景读者进入第二部分 Science 补给，完成合流必修后共同进入第三部分科研新范式和综合项目。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <style>
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .heading { font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .body { font: 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .small { font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .arrow { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">双入口 · 共同语言 · 科研闭环</text>

  <rect x="45" y="92" width="245" height="125" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="168" y="132" text-anchor="middle" class="heading">Science 背景</text>
  <text x="168" y="166" text-anchor="middle" class="body">懂科学问题</text>
  <text x="168" y="194" text-anchor="middle" class="body">需要补 AI 方法</text>

  <rect x="375" y="82" width="360" height="145" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="555" y="124" text-anchor="middle" class="heading">第一部分：AI 补给</text>
  <text x="555" y="160" text-anchor="middle" class="body">任务 · 数据 · 结构 · 科学机器学习</text>
  <text x="555" y="190" text-anchor="middle" class="body">不确定性 · 主动学习 · 贝叶斯优化</text>

  <rect x="45" y="365" width="245" height="125" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="168" y="405" text-anchor="middle" class="heading">AI 背景</text>
  <text x="168" y="439" text-anchor="middle" class="body">懂模型与代码</text>
  <text x="168" y="467" text-anchor="middle" class="body">需要补 Science 逻辑</text>

  <rect x="375" y="355" width="360" height="145" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="555" y="397" text-anchor="middle" class="heading">第二部分：Science 补给</text>
  <text x="555" y="433" text-anchor="middle" class="body">对象 · 尺度 · 变量 · 约束</text>
  <text x="555" y="463" text-anchor="middle" class="body">数据生成 · 实验验证 · 失败边界</text>

  <rect x="815" y="170" width="340" height="240" rx="22" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="985" y="216" text-anchor="middle" class="heading">第三部分：科研新范式</text>
  <text x="985" y="256" text-anchor="middle" class="body">文献 → 问题 → 计算 → 实验</text>
  <text x="985" y="290" text-anchor="middle" class="body">反馈 → 证据 → 写作与评审</text>
  <line x1="865" y1="320" x2="1105" y2="320" stroke="#fdba74" stroke-width="2"/>
  <text x="985" y="354" text-anchor="middle" class="body">综合项目</text>
  <text x="985" y="384" text-anchor="middle" class="small">最小、可验证、可复现的发现闭环</text>

  <path d="M290 154 L365 154" class="arrow"/>
  <path d="M290 427 L365 427" class="arrow"/>
  <path d="M735 154 C780 154 775 238 805 250" class="arrow"/>
  <path d="M735 427 C780 427 775 350 805 335" class="arrow"/>

  <rect x="360" y="540" width="480" height="52" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="573" text-anchor="middle" class="body">共同底座：科学问题、简单基线、不确定性、证据与可复现性</text>
</svg>
